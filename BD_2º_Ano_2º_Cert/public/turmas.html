<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas</title>
    <style>
      body { font-family: Arial; margin: 30px;}
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
      th { background-color: #eee; }
      .filtro {margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Lista de turmas</h1>

    <form id="formTurma">
      <label for="sigla">Sigla</label>
      <input type="text" id="sigla" required>
      <label for="curso">Curso</label>
      <input type="text" id="curso" required>
      <label for="serie">Série</label>
      <input type="text" id="serie" required>
      <button type="submit">Cadastrar</button>
    </form>

    <div class="filtro">
      <label for="pesquisa">Pesquisar por turma:</label>
      <input type="text" id="pesquisa" placeholder="Digite uma turma">
    </div>

    <table id="tabela">
        <thead>
        <tr><th>Sigla</th><th>Curso</th><th>Série</th></tr>
        </thead>
        <tbody></tbody>
    </table>

  <script>
    async function carregarTurmas(filtro = "") {
      const res = await fetch(`/api/turmas?sigla=${encodeURIComponent(filtro)}`);
      const turmas = await res.json();
      const tbody = document.querySelector("#tabela tbody");
      tbody.innerHTML = "";

      turmas.forEach(t => {
        const row = document.createElement("tr");
        row.innerHTML = `
        <td>${t.sigla}</td>
        <td>${t.curso}</td>
        <td>${t.serie}</td>`;
        tbody.appendChild(row);
      });
    }

    document.querySelector("#pesquisa").addEventListener("input", (e) => {
      carregarTurmas(e.target.value);
    });

    carregarTurmas();

    document.querySelector("#formTurma").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sigla = document.querySelector("#sigla").value;
      const curso = document.querySelector("#curso").value;
      const serie = document.querySelector("#serie").value;

      await fetch("/api/turma", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sigla, curso, serie})
      });

      e.target.reset();
      carregarTurmas();
    });
  </script>
</body>
</html>
